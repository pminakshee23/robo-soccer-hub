<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OMO Robo-Soccer League</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#8B5CF6;--s:#38BDF8;--ok:#34D399;--wa:#FBBF24;--er:#FB7185;--bg:#F8F7FF;--card:#fff;--tx:#1E293B;--mu:#64748b;--bd:#e9e5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141225;--card:#1e1b36;--tx:#eef2ff;--mu:#a5b0c8;--bd:#33305a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,sans-serif;margin:0 0 10px}
#app{display:flex;min-height:100vh}
nav{width:215px;background:var(--card);border-right:1px solid var(--bd);padding:14px;flex-shrink:0}
nav .logo{font:700 18px Poppins;color:var(--p)}nav small{display:block;color:var(--mu);margin-bottom:12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:10px 12px;border-radius:12px;cursor:pointer;font:500 14px Inter;margin:2px 0;transition:.2s}
nav button:hover{background:var(--bd)}nav button.on{background:var(--p);color:#fff}
main{flex:1;padding:18px;min-width:0;overflow-x:hidden}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.top .sp{flex:1}
input,select,textarea,button.b{font:14px Inter;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button.b{background:var(--p);color:#fff;border:0;cursor:pointer;font-weight:600}button.b.g{background:var(--bd);color:var(--tx)}button.b.r{background:var(--er)}button.b.k{background:var(--ok);color:#064e3b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 18px #8b5cf61a;transition:.2s}
.card.h:hover{transform:translateY(-3px);cursor:pointer;box-shadow:0 8px 24px #8b5cf633}
.kpi b{display:block;font:700 28px Poppins;color:var(--p)}.kpi span{color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:9px;transition:width .8s}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row .l{width:120px;font-size:12px;flex-shrink:0}.row .bar{flex:1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{cursor:pointer;color:var(--mu);font-size:12px}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#1E293B}
.ok{background:var(--ok)}.wa{background:var(--wa)}.er{background:var(--er)}.in{background:var(--s)}.gy{background:#cbd5e1}
.sess{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.sess button{padding:12px 0;border:0;border-radius:12px;font-weight:700;cursor:pointer;color:#1E293B}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.score{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border-radius:22px;padding:20px;text-align:center}
.score .n{font:700 52px Poppins}.score .t{font:700 16px Poppins}
.toast{position:fixed;bottom:20px;right:20px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;animation:up .3s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}#login .card{max-width:380px;text-align:center}
.bot{font-size:44px;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
@media(prefers-color-scheme:light){body{background:radial-gradient(circle at 8% 0,#ede9fe,transparent 40%),radial-gradient(circle at 100% 15%,#e0f2fe,transparent 40%),var(--bg)}}
#v{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.sk{height:110px;border-radius:18px;background:linear-gradient(90deg,var(--bd) 25%,var(--card) 50%,var(--bd) 75%);background-size:200% 100%;animation:sh 1s infinite}@keyframes sh{to{background-position:-200% 0}}
.mascot{background:linear-gradient(135deg,#ede9fe,#e0f2fe);border-radius:16px;padding:10px;text-align:center;margin-top:14px;font-weight:600;color:#6d28d9;font-size:12px}.mascot .bot{font-size:32px}
.big{font-size:22px!important;font-weight:700;padding:14px 24px!important;border-radius:16px!important;min-width:90px}
.timer{display:inline-block;font:700 60px Poppins;letter-spacing:2px;background:#0003;border-radius:20px;padding:2px 24px;margin:6px 0}
.conf{position:fixed;top:-30px;font-size:24px;z-index:99;animation:fall 2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.3}}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.25)}}
:root[data-theme=pitch]{--p:#16a34a;--s:#22c55e;--bg:#ecfdf3;--card:#fff;--bd:#bbf7d0;--tx:#14532d;--mu:#4d7c5f}
:root[data-theme=neon]{--p:#a78bfa;--s:#22d3ee;--bg:#0b1020;--card:#141b34;--bd:#27315a;--tx:#e6edff;--mu:#93a1c7}
:root[data-theme=sunset]{--p:#f97316;--s:#ec4899;--bg:#fff7ed;--card:#fff;--bd:#fed7aa;--tx:#431407;--mu:#9a5b3a}
:root[data-theme=pitch] body{background:repeating-linear-gradient(90deg,#ecfdf3 0 80px,#dcfce7 80px 160px)}
:root[data-theme=neon] body{background:radial-gradient(circle at 20% 0,#2a1b5e,transparent 45%),#0b1020}
:root[data-theme=sunset] body{background:linear-gradient(160deg,#fff7ed,#fce7f3)}
.hero{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border-radius:20px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hero b{font:700 18px Poppins}.hero span{font-size:28px;animation:bob 2s infinite}
.card{border-top:4px solid var(--s)}
@media(max-width:760px){#app{flex-direction:column}nav .mascot{display:none}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px}nav .logo,nav small{display:none}nav button{white-space:nowrap;width:auto}}
</style></head><body><div id="root"></div>
<script>
const SK=["Rules","Electronics","Construction","Programming","Speed & Control","Driving","Ball Handling","Goal Scoring","Strategy","Teamwork"];
const PH=[[1,2,"Competition Rules"],[3,5,"Electronics & Mechanical Design"],[6,10,"Build & Program 2 Robots"],[11,15,"Speed Tuning"],[16,20,"Driving Skills"],[21,25,"Ball Handling"],[26,30,"Strategy & Mock Matches"],[31,35,"Advanced Practice"],[36,40,"Simulation & Final Assessment"]];
const MS={2:"Rules done",5:"Designs final",10:"Robots functional",15:"Speed tuned",20:"Driving test",25:"Ball test",30:"Mock review",35:"Optimised",40:"Comp. ready"};
const BR=["Laxmi","Powai","Juhu","SOBO","Pune","Delhi","School"],CATS=["Elementary","Junior","Senior"];
const PRI=["Low","Medium","High","Critical"],ICAT=["Robot Hardware","Electronics","Programming","Wireless Control","Motor Performance","Driving Accuracy","Ball Handling","Game Strategy","Student Performance","Team Coordination","Other"];
const SC=["gy","in","ok","wa"],SN=["Not Started","In Progress","Completed","Needs Improvement"];
let D,U=null,V="overview",TID=null,F={q:"",br:"",cat:"",sort:"id",rank:"pts",ifil:""},LIVE=null,SEL=null,TMR=null;
const $=s=>document.querySelector(s),R=n=>Math.round(n);
function seed(){
 const T=[["Robo Rockets","Powai","Junior","Asha Rao",["Ishaan","Meera","Kabir"],34],["Goal Getters","Laxmi","Elementary","Vikram Shah",["Anaya","Rohan"],22],["Circuit Strikers","Juhu","Senior","Asha Rao",["Zoya","Dev","Neel"],38],["Turbo Kickers","Pune","Junior","Neha Iyer",["Aarav","Sia"],12],["Pixel Pandas","Delhi","Elementary","Neha Iyer",["Tara","Veer","Ria"],28],["Bolt Brigade","SOBO","Senior","Vikram Shah",["Kian","Myra"],8]];
 const teams=T.map((t,i)=>({id:"T"+(101+i),name:t[0],branch:t[1],cat:t[2],trainer:t[3],
  sess:Array.from({length:40},(_,k)=>k<t[5]?2:k==t[5]?1:0),notes:{},r1:t[5]>=10?1:0,r2:t[5]>=14?1:0,
  stu:t[4].map((n,j)=>({id:"S"+(i*10+j+1),n,att:80+((i*7+j*5)%20),as:[{d:"2026-10-1"+j,cp:Math.min(40,Math.floor(t[5]/5)*5)||5,s:SK.map((_,k)=>((i+j+k)%4==0)?null:5+((i*3+j*2+k*5)%5))}]})),review:""}));
 const m=(i,a,b,ga,gb)=>({id:"M"+(1001+i),date:"2026-10-"+(10+i),a:"T"+(101+a),b:"T"+(101+b),ga,gb,fa:i%3,fb:(i+1)%3,pa:0,pb:i%2,status:"Completed",type:"Mock Match "+(i+1)});
 return{teams,matches:[m(0,0,2,2,1),m(1,1,4,0,0),m(2,0,4,3,1),m(3,2,3,4,0),m(4,5,1,1,2)],
 issues:[{id:"I1",team:"T104",cat:"Robot Hardware",pri:"Critical",desc:"Robot 2 motor driver burnt",by:"Neha Iyer",to:"Neha Iyer",due:"2026-10-20",st:"Open",act:"Replace driver",hist:["Open"]},
 {id:"I2",team:"T106",cat:"Programming",pri:"High",desc:"Wireless control lag",by:"Vikram Shah",to:"Vikram Shah",due:"2026-11-05",st:"In Progress",act:"Retune PID",hist:["Open","In Progress"]},
 {id:"I3",team:"T101",cat:"Driving Accuracy",pri:"Low",desc:"Turning overshoot",by:"Asha Rao",to:"Asha Rao",due:"2026-10-25",st:"Resolved",act:"Practice drills",hist:["Open","Resolved"]}],demo:true}}
function load(){try{D=JSON.parse(localStorage.getItem("rsh")||"null")}catch(e){}if(!D)D=seed();fixIds()}
function nextId(){return "T"+(D.teams.reduce((m,t)=>Math.max(m,parseInt(String(t.id).slice(1))||0),100)+1)}
function fixIds(){const seen=new Set();D.teams.forEach(t=>{if(!/^T\d+$/.test(t.id)||seen.has(t.id))t.id=nextId();seen.add(t.id)});save()}
function save(){try{localStorage.setItem("rsh",JSON.stringify(D))}catch(e){}}
function confetti(){for(let i=0;i<20;i++){const e=document.createElement("div");e.className="conf";e.textContent=["\u26bd","\ud83e\udd16","\u2b50","\ud83c\udf89"][i%4];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.6+"s";document.body.append(e);setTimeout(()=>e.remove(),3000)}}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),Math.max(2200,m.length*70))}
const vis=()=>U.role!="trainer"?D.teams:D.teams.filter(t=>t.trainer==U.name);
const tm=id=>D.teams.find(t=>t.id==id)||{name:"?",id};
const done=t=>t.sess.filter(s=>s==2).length,prog=t=>R(done(t)/40*100);
const pct=(a,b)=>b?R(a/b*100):0;
function st(id){const o={mp:0,w:0,l:0,d:0,gf:0,ga:0,f:0,p:0};D.matches.filter(m=>m.status=="Completed"&&(m.a==id||m.b==id)).forEach(m=>{const a=m.a==id,g=a?m.ga:m.gb,c=a?m.gb:m.ga;o.mp++;o.gf+=g;o.ga+=c;o.f+=a?m.fa:m.fb;o.p+=a?m.pa:m.pb;g>c?o.w++:g<c?o.l++:o.d++});o.gd=o.gf-o.ga;o.wp=pct(o.w,o.mp);o.pts=o.w*3+o.d;return o}
const open_=t=>D.issues.filter(i=>i.team==t.id&&i.st!="Resolved").length;
const crit=t=>D.issues.some(i=>i.team==t.id&&i.st!="Resolved"&&i.pri=="Critical");
const late=t=>(done(t)>=10&&!(t.r1&&t.r2))||crit(t);
function status(t){return late(t)?["Needs Attention","er"]:prog(t)>=90?["Competition Ready","ok"]:prog(t)<35?["In Training","in"]:["On Track","ok"]}
const asPct=s=>{const a=s.s.filter(x=>x!=null);return a.length?pct(a.reduce((x,y)=>x+y,0),a.length*10):0};
const stuScore=s=>s.as.length?asPct(s.as[s.as.length-1]):0;
function csv(rows){return"\ufeff"+rows.map(r=>r.map(c=>{c=c==null?"":String(c);return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")).join("\r\n")}
function bars(items,max){return items.map(([l,v,c])=>`<div class=row><span class=l>${l}</span><div class=bar><i style="width:${max?v/max*100:v}%;${c?"background:"+c:""}"></i></div><b>${v}${max?"":"%"}</b></div>`).join("")}
function pill(t,c){return`<span class="pill ${c}">${t}</span>`}

function loginUI(){
 $("#root").innerHTML=`<div id=login><div class=card><div class=bot>🤖</div><h1>OMO Robo-Soccer League</h1><p style="margin:0 0 6px">${logoImg(40)}</p><p style="color:var(--mu);margin:0">by OMOTEC · Codeavour Track 3</p><p style="color:var(--mu)">Build • Code • Play • Win!</p>
 <p><select id=lr style="width:100%"><option value=head>Team Lead / Admin</option><option value=exec>Executive Team (read-only)</option>${[...new Set(D.teams.map(t=>t.trainer))].map(n=>`<option>${n}</option>`).join("")}</select></p>
 <p><input id=lp type=password placeholder="Password" style="width:100%"></p>
 <button class=b style="width:100%" onclick="doLogin()">Login</button><p style="font-size:12px;color:var(--mu)">Demo data – stored only in this browser.</p></div></div>`}
function doLogin(){const v=$("#lr").value;if($("#lp").value!=="password123")return toast("Wrong password");U=v=="head"?{role:"head",name:"Team Lead"}:v=="exec"?{role:"exec",name:"Executive Team"}:{role:"trainer",name:v};V=U.role=="exec"?"exec":"overview";shell()}
function shell(){
 const N=[...(U.role=="exec"?[["exec","👔 Executive Summary"]]:[]),["overview","🏠 Overview"],["teams","🤖 Team Management"],["students","⭐ Student Performance"],["matches","⚽ Mock Matches"],["board","🏆 Scores & Leaderboard"],["issues","🚨 Issues & Actions"],["reports","📊 Reports & CSV"],["settings","⚙️ Settings"]];
 $("#root").innerHTML=`<div id=app><nav><div style="margin-bottom:8px">${logoImg(34)}</div><div class=logo>🤖 OMO Robo-Soccer League</div><small>Build • Code • Play • Win!</small>${N.map(n=>`<button class="${V==n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("")}<div class=mascot><div class=bot>🤖⚽</div>Build • Code • Play • Win!</div></nav><main><div class=hero><div><b>⚽ OMO Robo-Soccer League</b><br>by OMOTEC · Codeavour Track 3 · Build • Code • Play • Win!</div><span style="background:#fff;border-radius:12px;padding:6px 10px;animation:none">${logoImg(34)}</span></div><div class=top>
 <input placeholder="🔍 Search teams" value="${F.q}" oninput="F.q=this.value;draw()">
 <select onchange="F.br=this.value;draw()"><option value="">All branches</option>${BR.map(b=>`<option ${F.br==b?"selected":""}>${b}</option>`).join("")}</select>
 <select onchange="F.cat=this.value;draw()"><option value="">All categories</option>${CATS.map(b=>`<option ${F.cat==b?"selected":""}>${b}</option>`).join("")}</select>
 <select onchange="F.tr=this.value;draw()"><option value="">All trainers</option>${[...new Set(D.teams.map(t=>t.trainer))].map(n=>`<option ${F.tr==n?"selected":""}>${n}</option>`).join("")}</select><select onchange="TID=this.value||null;draw()"><option value="">Select team</option>${vis().map(t=>`<option value=${t.id} ${TID==t.id?"selected":""}>${t.name}</option>`).join("")}</select>
 <span class=sp></span><select title="Theme" onchange="setTh(this.value)">${[["light","🎨 Pastel"],["pitch","⚽ Pitch"],["neon","🤖 Neon Robot"],["sunset","🌅 Sunset"]].map(x=>`<option value=${x[0]} ${TH==x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><button class="b g" title="Notifications" onclick="notif()">🔔 ${alerts().length}</button><span>👤 ${U.name}</span><button class="b g" onclick="U=null;loginUI()">Logout</button></div><div id=v><div class=sk></div></div></main></div>`;setTimeout(()=>{if(U)draw()},250)}
function go(v){V=v;if(v=="teams")TID=null;shell()}
function filt(){return vis().filter(t=>(!F.tr||t.trainer==F.tr)&&(!F.q||t.name.toLowerCase().includes(F.q.toLowerCase()))&&(!F.br||t.branch==F.br)&&(!F.cat||t.cat==F.cat))}
function alerts(){const a=[];vis().forEach(t=>{if(done(t)>=10&&!(t.r1&&t.r2))a.push(`${t.name}: both robots not functional by Session 10`);if(crit(t))a.push(`${t.name}: critical issue open`)});D.issues.filter(i=>i.st!="Resolved"&&i.due<new Date().toISOString().slice(0,10)&&vis().some(t=>t.id==i.team)).forEach(i=>a.push(`${i.id} overdue (${tm(i.team).name})`));return a}
function notif(){toast(alerts().join(" \u2022 ")||"No alerts 🎉")}
function draw(){const f={exec,overview,teams,training,students,matches,board,issues,reports,settings}[V];$("#v").innerHTML=f();if(V=="matches"&&LIVE)tick()}

function overview(){
 const T=filt(),all=vis(),oi=D.issues.filter(i=>i.st!="Resolved"&&all.some(t=>t.id==i.team)),att=all.filter(late);
 const K=[["Teams",all.length,"teams"],["Students",all.reduce((a,t)=>a+t.stu.length,0),"students"],["Trainers",new Set(all.map(t=>t.trainer)).size,"teams"],["Avg Progress",(all.length?R(all.reduce((a,t)=>a+prog(t),0)/all.length):0)+"%","training"],["Mock Matches",D.matches.length,"matches"],["Competition Ready",all.filter(t=>status(t)[0]=="Competition Ready").length,"teams"],["Open Issues",oi.length,"issues"],["Need Attention",att.length,"issues"]];
 const brs=BR.map(b=>{const x=all.filter(t=>t.branch==b);return x.length?[b,R(x.reduce((a,t)=>a+prog(t),0)/x.length)]:null}).filter(Boolean);
 const ic=ICAT.map(c=>[c,oi.filter(i=>i.cat==c).length]).filter(x=>x[1]);
 return`<h1>Overview</h1><div class=grid>${K.map(k=>`<div class="card kpi h" onclick="${k[0]=="Open Issues"?"F.ifil='open';":k[0]=="Need Attention"?"F.ifil='crit';":""}go('${k[2]}')"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
 <div class=two><div class=card><h3>Training progress (of 40)</h3>${bars(all.map(t=>[t.name,prog(t)]))}</div>
 <div class=card><h3>Branch performance</h3>${bars(brs)}</div>
 <div class=card><h3>Match results</h3>${bars(all.map(t=>{const s=st(t.id);return[t.name,s.w+"W "+s.d+"D "+s.l+"L"]}).map((x,i)=>[x[0],st(all[i].id).wp,"var(--ok)"]))}</div>
 <div class=card><h3>Issues by category</h3>${ic.length?bars(ic,Math.max(...ic.map(x=>x[1])),""):"🎉 No open issues"}</div></div>
 <div class=card style="margin-top:12px"><h3>Team summary</h3><div class=tw><table><tr>${["ID","Team","Branch","Category","Trainer","Students","Sessions","Progress","Robot 1","Robot 2","Played","Win %","Issues","Status"].map(h=>`<th>${h}</th>`).join("")}<th></th></tr>
 ${T.map(t=>{const s=st(t.id),z=status(t);return`<tr><td>${t.id}<td>${t.name}<td>${t.branch}<td>${t.cat}<td>${t.trainer}<td>${t.stu.length}<td>${done(t)}/40<td>${prog(t)}%<td>${t.r1?"✅":"⚠️"}<td>${t.r2?"✅":"⚠️"}<td>${s.mp}<td>${s.wp}%<td>${open_(t)}<td>${pill(z[0],z[1])}<td><button class="b g" onclick="TID='${t.id}';V='teams';shell()">View</button></tr>`}).join("")}</table></div></div>`}

function teams(){
 if(TID&&tm(TID).sess)return detail(tm(TID));
 const T=filt();
 return`<h1>Team Management</h1>${U.role=="head"?`<div class=card style="margin-bottom:12px"><h3>➕ Add team</h3><div class=top><input id=nn placeholder="Team name"><select id=nb>${BR.map(b=>`<option>${b}</option>`).join("")}</select><select id=nc>${CATS.map(b=>`<option>${b}</option>`).join("")}</select><input id=nt list=tl placeholder="Trainer name"><datalist id=tl>${[...new Set(D.teams.map(t=>t.trainer))].map(n=>`<option>${n}</option>`).join("")}</datalist><label>Registered <input id=nd type=date value="${new Date().toISOString().slice(0,10)}"></label><select id=nx><option>Active</option><option>Pending</option></select><textarea id=ns rows=3 style="width:100%" placeholder="Students, one per line: Name, Grade (e.g. Aarav, 6)"></textarea><button class=b onclick="addTeam()">Register team</button></div></div>`:""}
 <div class=grid>${T.map(t=>{const s=st(t.id),z=status(t);return`<div class="card h" onclick="TID='${t.id}';draw()"><div style="font-size:30px">🤖⚽</div><h3>${t.name}</h3><div style="color:var(--mu)">${t.branch} · ${t.cat}<br>Trainer: ${t.trainer} · ${t.stu.length} students</div><div class=bar style="margin:8px 0"><i style="width:${prog(t)}%"></i></div>${prog(t)}% · ${s.mp} played · ${s.wp}% wins<br>${pill(z[0],z[1])}</div>`}).join("")||"<p>🤖 No teams found.</p>"}</div>`}
function addTeam(){const n=$("#nn").value.trim();if(!n)return toast("Enter a team name");if(!$("#nt").value.trim())return toast("Enter a trainer");if(!$("#ns").value.trim())return toast("Add at least one student");if(D.teams.some(t=>t.name.toLowerCase()==n.toLowerCase()))return toast("Team name already exists");
 const id="T"+(101+D.teams.length+Math.floor(Math.random()*50)*0);D.teams.push({id:nextId(),name:n,branch:$("#nb").value,cat:$("#nc").value,trainer:$("#nt").value||"Unassigned",sess:Array(40).fill(0),notes:{},r1:0,r2:0,reg:$("#nd").value,status:$("#nx").value,stu:$("#ns").value.split("\n").map(s=>s.trim()).filter(Boolean).map((x,i)=>{const p=x.split(",");return{id:"S"+Date.now()%100000+i,n:p[0].trim(),g:(p[1]||"").trim(),att:100,as:[]}}),review:""});D.demo=false;save();toast("Team added 🎉");draw()}
let TAB="Overview";
function detail(t){
 const s=st(t.id),z=status(t),ms=D.matches.filter(m=>m.a==t.id||m.b==t.id),is=D.issues.filter(i=>i.team==t.id);
 const ph=PH.find(p=>done(t)<=p[1])||PH[8];
 const body={Overview:`<p>${t.branch} · ${t.cat} · Trainer ${t.trainer}<br>Students: ${t.stu.map(x=>x.n+(x.g?" (Gr "+x.g+")":"")).join(", ")}${t.reg?"<br>Registered: "+t.reg+" · "+(t.status||"Active"):""}<br>Phase: <b>${ph[2]}</b> · ${done(t)}/40 sessions (${prog(t)}%)</p>
  <div class=row><span class=l>Robot 1</span><button class="b ${t.r1?"k":"g"}" onclick="rob('${t.id}',1)">${t.r1?"Functional ✅":"Not ready ⚠️"}</button><span class=l>Robot 2</span><button class="b ${t.r2?"k":"g"}" onclick="rob('${t.id}',2)">${t.r2?"Functional ✅":"Not ready ⚠️"}</button></div>
  <div class=row>${Object.entries(MS).map(([k,v])=>`<span class="pill ${done(t)>=k?"ok":"gy"}" title="${v}">S${k}</span>`).join(" ")}</div>
  <p>Played ${s.mp} · W${s.w} D${s.d} L${s.l} · GF ${s.gf} GA ${s.ga} · Win ${s.wp}%</p>
  <textarea id=rv rows=3 style="width:100%" placeholder="Team Head remarks (observation, improvements, next review)" ${U.role!="head"?"disabled":""}>${t.review||""}</textarea>${U.role=="head"?`<button class=b onclick="tm_('${t.id}').review=$('#rv').value;save();toast('Review saved')">Save review</button>`:""}`,
  Training:sessGrid(t),
  Students:`<div class=tw><table><tr><th>Student<th>Score<th>Skills assessed</tr>${t.stu.map(x=>`<tr><td>${x.n}<td>${stuScore(x)}%<td>${x.as.length?x.as[x.as.length-1].s.filter(v=>v!=null).length+"/10":"-"}</tr>`).join("")}</table></div>`,
  Matches:`<div class=tw><table><tr><th>Date<th>Opponent<th>Score<th>Result<th>Fouls<th>Pen.</tr>${ms.map(m=>{const a=m.a==t.id,g=a?m.ga:m.gb,c=a?m.gb:m.ga;return`<tr><td>${m.date}<td>${tm(a?m.b:m.a).name}<td>${g}:${c}<td>${g>c?"Win":g<c?"Loss":"Draw"}<td>${a?m.fa:m.fb}<td>${a?m.pa:m.pb}</tr>`}).join("")}</table></div>`,
  Issues:is.map(i=>`<p>${pill(i.pri,i.pri=="Critical"?"er":i.pri=="High"?"wa":"in")} <b>${i.id}</b> ${i.desc} – ${i.st} (due ${i.due})</p>`).join("")||"🎉 No issues"}[TAB];
 return`<button class="b g" onclick="TID=null;draw()">← Teams</button><h1 style="margin-top:10px">🤖 ${t.name} ${pill(z[0],z[1])}</h1>${U.role=="head"?editBar(t):""}<div class=tabs>${Object.keys({Overview:1,Training:1,Students:1,Matches:1,Issues:1}).map(x=>`<button class="b ${TAB==x?"":"g"}" onclick="TAB='${x}';draw()">${x}</button>`).join("")}<button class="b k" onclick="exportTeam('${t.id}')">⬇ Export Team Data</button>${U.role=="head"?`<input id=rn value="${t.name.replace(/"/g,"&quot;")}" style="width:150px"><button class="b g" onclick="renTeam('${t.id}')">Rename</button><button class="b r" onclick="delTeam('${t.id}')">Delete team</button>`:""}</div><div class=card>${body}</div>`}
function tm_(id){return D.teams.find(t=>t.id==id)}
function sure(k,fn){if(window.ARM==k){ARM=null;fn()}else{ARM=k;toast("Tap again to confirm");setTimeout(()=>{if(ARM==k)ARM=null},4000)}}
function delTeam(id){sure("d"+id,()=>{D.teams=D.teams.filter(t=>t.id!=id);D.matches=D.matches.filter(m=>m.a!=id&&m.b!=id);D.issues=D.issues.filter(i=>i.team!=id);TID=null;D.demo=false;save();toast("Team deleted");draw()})}
function renTeam(id){const v=$("#rn").value.trim();if(!v)return toast("Enter a name");if(D.teams.some(t=>t.id!=id&&t.name.toLowerCase()==v.toLowerCase()))return toast("Name already used");tm_(id).name=v;save();toast("Team renamed");draw()}
function clearAll(){D={teams:[],matches:[],issues:[],demo:false};TID=null;save();toast("All entries cleared");draw()}
function delTr(n){D.teams.forEach(t=>{if(t.trainer==n)t.trainer="Unassigned"});save();toast("Trainer removed");draw()}
function adminBtns(){const tr=[...new Set(D.teams.map(t=>t.trainer))];return`<div class=top><button class="b r" onclick="sure('rd',()=>{D=seed();save();toast('Demo data restored');draw()})">Reset to demo data</button><button class="b r" onclick="sure('ce',clearAll)">Clear ALL entries</button></div><p style="color:var(--mu)">Tap a red button twice to confirm.</p><h3>Trainer accounts</h3>${tr.map(n=>`<div class=row><span class=l style="width:200px">${n}</span><button class="b g" onclick="sure('t${n}',()=>delTr('${n}'))">Remove</button></div>`).join("")||"No trainers"}`}
function stuHead(t,sid){const can=U.role=="head"||t.trainer==U.name;return`<div class=top><select onchange="TID=this.value;SID=null;draw()">${vis().map(x=>`<option value=${x.id} ${x.id==t.id?"selected":""}>${x.name}</option>`).join("")}</select><select onchange="SID=this.value;draw()">${t.stu.map(x=>`<option value=${x.id} ${x.id==sid?"selected":""}>${x.n}</option>`).join("")}</select></div>${can?`<div class=card style="margin-bottom:12px"><div class=top style="margin:0"><input id=an placeholder="New student name"><input id=ag placeholder="Grade" style="width:80px"><button class=b onclick="addStu('${t.id}')">Add student</button>${sid?`<button class="b r" onclick="delStu('${t.id}','${sid}')">Remove student</button>`:""}</div></div>`:""}`}
function addStu(tid){const n=$("#an").value.trim();if(!n)return toast("Enter a student name");const id="S"+Date.now()%1e6;tm_(tid).stu.push({id,n,g:$("#ag").value.trim(),att:100,as:[]});SID=id;D.demo=false;save();toast("Student added");draw()}
function setAtt(tid,sid){const v=parseInt($("#at").value);if(isNaN(v)||v<0||v>100)return toast("Enter 0-100");tm_(tid).stu.find(s=>s.id==sid).att=v;save();toast("Attendance updated");draw()}
function delStu(tid,sid){sure("s"+sid,()=>{const t=tm_(tid);t.stu=t.stu.filter(s=>s.id!=sid);SID=null;save();toast("Student removed");draw()})}
function editBar(t){return`<div class=card style="margin-bottom:10px"><div class=top style="margin:0"><select id=eb>${BR.map(b=>`<option ${t.branch==b?"selected":""}>${b}</option>`).join("")}</select><select id=ec>${CATS.map(b=>`<option ${t.cat==b?"selected":""}>${b}</option>`).join("")}</select><input id=et list=tl2 value="${t.trainer}"><datalist id=tl2>${[...new Set(D.teams.map(x=>x.trainer))].map(n=>`<option>${n}</option>`).join("")}</datalist><select id=ex>${["Active","Pending","Archived"].map(b=>`<option ${(t.status||"Active")==b?"selected":""}>${b}</option>`).join("")}</select><button class=b onclick="saveTeam('${t.id}')">Save team details</button></div></div>`}
function saveTeam(id){const t=tm_(id);t.branch=$("#eb").value;t.cat=$("#ec").value;t.trainer=$("#et").value.trim()||"Unassigned";t.status=$("#ex").value;save();toast("Team updated");draw()}
function rob(id,n){const t=tm_(id);t["r"+n]=t["r"+n]?0:1;save();draw()}
function sessGrid(t){
 const sel=SEL&&SEL.t==t.id?SEL.n:null,can=U.role=="head"||t.trainer==U.name;
 return`<div class=sess>${t.sess.map((v,i)=>`<button class=${SC[v]} style="outline:${sel==i+1?"3px solid var(--p)":"none"}" title="${PH.find(p=>i+1>=p[0]&&i+1<=p[1])[2]}" onclick="SEL={t:'${t.id}',n:${i+1}};draw()">${i+1}</button>`).join("")}</div>
 <p>${SN.map((n,i)=>pill(n,SC[i])).join(" ")}</p>
 ${sel?`<div class=card style="background:var(--bg)"><h3>Session ${sel} – ${PH.find(p=>sel>=p[0]&&sel<=p[1])[2]}${MS[sel]?" 🏁 "+MS[sel]:""}</h3><div class=top><select id=ss ${can?"":"disabled"}>${SN.map((n,i)=>`<option value=${i} ${t.sess[sel-1]==i?"selected":""}>${n}</option>`).join("")}</select><input id=sd type=date><input id=sn style="flex:1" placeholder="Trainer remarks" value="${(t.notes[sel]||"").replace(/"/g,"&quot;")}" ${can?"":"disabled"}>${can?`<button class=b onclick="saveSess('${t.id}',${sel})">Save</button>`:""}</div></div>`:"<p>Tap a session to update it.</p>"}`}
function saveSess(id,n){const t=tm_(id),v=+$("#ss").value;t.sess[n-1]=v;t.notes[n]=$("#sn").value;D.demo=D.demo;save();if(v==2&&MS[n])confetti(),toast("🎉 Milestone: "+MS[n]);else toast("Session saved");draw()}
function training(){const L=filt();if(!TID&&L[0])TID=L[0].id;const t=tm(TID);return`<h1>Training Progress</h1>${t.sess?`<div class=card><h3>${t.name} – ${prog(t)}%</h3>${sessGrid(t)}</div>`:"<p>No team</p>"}<div class=card style="margin-top:12px"><h3>Phases</h3>${PH.map((p,i)=>`<div class=row><span class=l>${i+1}. S${p[0]}–${p[1]}</span><span>${p[2]}</span></div>`).join("")}</div>`}

function students(){
 const t=TID&&tm(TID).sess?tm(TID):filt()[0];if(!t)return"<h1>Student Performance</h1><div class=card style='text-align:center'><div class=bot>🤖</div><p>No teams yet. Register a team in Team Management first.</p></div>";
 const sid=window.SID&&t.stu.find(s=>s.id==window.SID)?window.SID:(t.stu[0]||{}).id,s=t.stu.find(x=>x.id==sid);
 if(!s)return`<h1>Student Performance</h1>${stuHead(t,"")}<div class=card style='text-align:center'><div class=bot>⚽</div><p>No students in ${t.name} yet. Add one above.</p></div>`;
 const last=s.as[s.as.length-1],sc=stuScore(s);
 const badges=[["🤖 Robot Builder",last&&last.s[2]>=8],["💻 Coding Champion",last&&last.s[3]>=8],["🎮 Driving Expert",last&&last.s[5]>=8],["⚽ Goal Master",last&&last.s[7]>=8],["🏆 Soccer Star",sc>=80]];
 return`<h1>Student Performance</h1>${stuHead(t,sid)}
 <div class=two><div class=card><h3>${s.n} · ${sc}%</h3><div class=bar style="margin:8px 0"><i style="width:${sc}%"></i></div>${last?bars(SK.map((k,i)=>[k,last.s[i]==null?0:last.s[i]*10])).replace(/(\d+)%<\/b>/g,"$1</b>")+"<small>Not assessed skills show as 0 bar but are excluded from the score.</small>":"No assessments yet"}
 <p>${badges.map(b=>`<span class="pill ${b[1]?"wa":"gy"}" style="margin:2px;display:inline-block;opacity:${b[1]?1:.5}">${b[0]}</span>`).join("")}</p>
 <p style="color:var(--mu)">Badges unlock at skill ≥ 8/10 (Soccer Star: overall ≥ 80%).</p>
 <b>History:</b> ${s.as.map(a=>`S${a.cp}: ${asPct(a)}%`).join(" → ")||"-"}</div>
 <div class=card><h3>New assessment</h3><div class=top><select id=cp>${[5,10,15,20,25,30,35,40].map(c=>`<option>${c}</option>`).join("")}</select></div>
 ${SK.map((k,i)=>`<div class=row><span class=l>${k}</span><input id=sk${i} type=number min=0 max=10 placeholder="n/a" style="width:80px"></div>`).join("")}
 <button class=b onclick="addAs('${t.id}','${s.id}')">Save assessment</button></div></div>`}
function addAs(tid,sid){const s=tm_(tid).stu.find(x=>x.id==sid);s.as.push({d:new Date().toISOString().slice(0,10),cp:+$("#cp").value,s:SK.map((_,i)=>{const v=$("#sk"+i).value;return v===""?null:Math.max(0,Math.min(10,+v))})});save();toast("Assessment saved ⭐");draw()}

function matches(){
 const L=D.matches.filter(m=>vis().some(t=>t.id==m.a||t.id==m.b));
 const opt=(i)=>vis().concat(U.role=="head"?[]:D.teams.filter(t=>!vis().includes(t))).map(t=>`<option value=${t.id}>${t.name}</option>`).join("");
 const l=LIVE;
 return`<h1>Mock Matches & Live Score</h1><div class=score><div class=top style="justify-content:center"><select id=la>${opt()}</select> VS <select id=lb>${D.teams.map((t,i)=>`<option value=${t.id} ${i==1?"selected":""}>${t.name}</option>`).join("")}</select><button class="b k big" onclick="startLive()">▶ Start new match</button></div>
 ${l?`<div class=t>${tm(l.a).name} ⚽ vs ⚽ ${tm(l.b).name}</div><div class=n id=sc>${String(l.ga).padStart(2,"0")} : ${String(l.gb).padStart(2,"0")}</div><div>Half ${l.half} · <span class=timer id=tm>${fmt(l.t)}</span> · Fouls ${l.fa}-${l.fb} · Penalties ${l.pa}-${l.pb}</div><div>H1 ${l.h1[0]}:${l.h1[1]}</div>
 <div class=top style="justify-content:center"><button class="b k big" onclick="L('ga',1)">+ A</button><button class="b r big" onclick="L('ga',-1)">− A</button><button class="b k big" onclick="L('gb',1)">+ B</button><button class="b r big" onclick="L('gb',-1)">− B</button><button class="b g" onclick="L('fa',1)">Foul A</button><button class="b g" onclick="L('fb',1)">Foul B</button><button class="b g" onclick="L('pa',1)">Pen A</button><button class="b g" onclick="L('pb',1)">Pen B</button></div>
 <div class=top style="justify-content:center"><button class="b k big" onclick="timer()">${l.run?"Pause":"Start/Resume"}</button><button class="b g big" onclick="resetT()">Reset timer</button><button class="b g big" onclick="endHalf()">End half</button><button class="b g" onclick="clearInterval(TMR);LIVE=null;draw()">Cancel match</button><button class="b r" onclick="endMatch()">End & save</button><label>Half length (s) <input type=number style="width:70px" value=${l.len} onchange="LIVE.len=+this.value;LIVE.t=+this.value"></label></div>`:`<p>Pick two teams and start a match (default 2 × 2 min halves – editable).</p>`}</div>
 <div class=grid style="margin-top:12px">${L.map(m=>`<div class=card><b>${tm(m.a).name} ⚽ VS ⚽ ${tm(m.b).name}</b><div class=n style="font:700 26px Poppins">${m.ga} : ${m.gb}</div>${m.date} · ${m.type}<br>${pill(m.status,"ok")} Winner: ${m.ga==m.gb?"Draw":tm(m.ga>m.gb?m.a:m.b).name}<br>Fouls ${m.fa}-${m.fb} · Pen ${m.pa}-${m.pb}</div>`).join("")}</div>`}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function startLive(){const a=$("#la").value;let b=$("#lb").value;if(!a)return toast("Register at least 2 teams first");if(a==b){const o=D.teams.find(t=>t.id!=a);if(!o)return toast("Pick two different teams");b=o.id}clearInterval(TMR);LIVE={a,b,ga:0,gb:0,fa:0,fb:0,pa:0,pb:0,half:1,len:120,t:120,run:0,h1:[0,0]};toast("Match started! Good luck \u26bd");timer()}
function L(k,d){LIVE[k]=Math.max(0,LIVE[k]+d);draw();if(d>0&&(k=="ga"||k=="gb")){const e=$("#sc");if(e)e.classList.add("pop");confetti()}}
function timer(){LIVE.run=!LIVE.run;clearInterval(TMR);if(LIVE.run)TMR=setInterval(()=>{LIVE.t=Math.max(0,LIVE.t-1);const e=$("#tm");if(e)e.textContent=fmt(LIVE.t);if(!LIVE.t){clearInterval(TMR);LIVE.run=0;toast("⏱ Time! End the half.")}},1000);draw()}
function tick(){}
function resetT(){clearInterval(TMR);LIVE.run=0;LIVE.t=LIVE.len;draw()}
function endHalf(){if(LIVE.half==1){LIVE.h1=[LIVE.ga,LIVE.gb];LIVE.half=2;LIVE.t=LIVE.len;LIVE.run=0;clearInterval(TMR);toast("Half 1 ended – 1 min break")}draw()}
function endMatch(){clearInterval(TMR);const l=LIVE;D.matches.push({id:"M"+(1001+D.matches.length),date:new Date().toISOString().slice(0,10),a:l.a,b:l.b,ga:l.ga,gb:l.gb,fa:l.fa,fb:l.fb,pa:l.pa,pb:l.pb,status:"Completed",type:"Mock Match "+(D.matches.length+1)});LIVE=null;save();toast("Result saved 🏆");draw()}

function board(){
 const rows=filt().map(t=>({t,...st(t.id)})),m=F.rank;
 rows.sort((a,b)=>m=="wp"?b.wp-a.wp||b.gd-a.gd:m=="gd"?b.gd-a.gd:b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
 const tot=rows.reduce((o,r)=>{o.w+=r.w;o.l+=r.l;o.d+=r.d;o.gf+=r.gf;o.ga+=r.ga;return o},{w:0,l:0,d:0,gf:0,ga:0});
 return`<h1>Game Scores & Leaderboard</h1><div class=grid>${[["Wins",tot.w],["Losses",tot.l],["Draws",tot.d],["Goals scored",tot.gf],["Goals conceded",tot.ga]].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
 <div class=card><div class=top><label>Ranking method <select onchange="F.rank=this.value;draw()"><option value=pts ${m=="pts"?"selected":""}>Points (W3 D1) then GD</option><option value=wp ${m=="wp"?"selected":""}>Win %</option><option value=gd ${m=="gd"?"selected":""}>Goal difference</option></select></label><small style="color:var(--mu)">Configurable – confirm the official method before the competition.</small></div>
 <div class=tw><table><tr><th>Rank<th>Team<th>Branch<th>Category<th>P<th>W<th>L<th>D<th>GF<th>GA<th>GD<th>Win %</tr>${rows.map((r,i)=>`<tr><td>${["🥇","🥈","🥉"][i]||i+1}<td>${r.t.name}<td>${r.t.branch}<td>${r.t.cat}<td>${r.mp}<td>${r.w}<td>${r.l}<td>${r.d}<td>${r.gf}<td>${r.ga}<td>${r.gd}<td>${r.wp}%</tr>`).join("")}</table></div></div>
 <div class=card style="margin-top:12px"><h3>Goals scored vs conceded</h3>${bars(rows.map(r=>[r.t.name+" ⚽",r.gf,"var(--ok)"]).concat(rows.map(r=>[r.t.name+" 🥅",r.ga,"var(--er)"])),Math.max(1,...rows.map(r=>Math.max(r.gf,r.ga))))}</div>`}

function issues(){
 const today=new Date().toISOString().slice(0,10);let L=D.issues.filter(i=>vis().some(t=>t.id==i.team));
 if(F.ifil=="open")L=L.filter(i=>i.st!="Resolved");if(F.ifil=="crit")L=L.filter(i=>i.st!="Resolved"&&(i.pri=="Critical"||i.pri=="High"));
 const od=i=>i.st!="Resolved"&&i.due<today;
 const c=x=>D.issues.filter(x).length;
 return`<h1>Issues & Corrective Actions</h1><div class=grid>${[["Open",c(i=>i.st!="Resolved")],["High",c(i=>i.st!="Resolved"&&i.pri=="High")],["Critical",c(i=>i.st!="Resolved"&&i.pri=="Critical")],["Overdue",c(od)],["Resolved",c(i=>i.st=="Resolved")]].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
 <div class=card style="margin-bottom:12px"><h3>🚨 Report issue</h3><div class=top><select id=it>${vis().map(t=>`<option value=${t.id}>${t.name}</option>`).join("")}</select><select id=ic>${ICAT.map(c=>`<option>${c}</option>`).join("")}</select><select id=ip>${PRI.map(c=>`<option>${c}</option>`).join("")}</select><input id=id type=date><input id=ix placeholder="Description" style="flex:1"><button class=b onclick="addIssue()">Report</button></div></div>
 <div class=top><select onchange="F.ifil=this.value;draw()"><option value="">All</option><option value=open ${F.ifil=="open"?"selected":""}>Unresolved</option><option value=crit ${F.ifil=="crit"?"selected":""}>High/Critical</option></select></div>
 <div class="card tw"><table><tr><th>ID<th>Team<th>Category<th>Priority<th>Description<th>Deadline<th>Status<th>Corrective action</tr>${L.map(i=>`<tr style="${od(i)?"background:#fb718522":""}"><td>${i.id}<td>${tm(i.team).name}<td>${i.cat}<td>${pill(i.pri,i.pri=="Critical"?"er":i.pri=="High"?"wa":"in")}<td>${i.desc}<td>${i.due}${od(i)?" ⏰":""}<td><select onchange="setIs('${i.id}',this.value)">${["Open","In Progress","Resolved"].map(s=>`<option ${i.st==s?"selected":""}>${s}</option>`).join("")}</select><td>${U.role=="head"?`<input value="${(i.act||"").replace(/"/g,"&quot;")}" onchange="D.issues.find(x=>x.id=='${i.id}').act=this.value;save()">`:i.act||"-"}</tr>`).join("")}</table></div>`}
function addIssue(){const d=$("#ix").value.trim();if(!d)return toast("Add a description");D.issues.push({id:"I"+(D.issues.length+1),team:$("#it").value,cat:$("#ic").value,pri:$("#ip").value,desc:d,by:U.name,to:tm($("#it").value).trainer,due:$("#id").value||new Date(Date.now()+6048e5).toISOString().slice(0,10),st:"Open",act:"",hist:["Open"]});save();toast("Issue reported");draw()}
function setIs(id,s){const i=D.issues.find(x=>x.id==id);i.st=s;i.hist.push(s);if(s=="Resolved")i.resolved=new Date().toISOString().slice(0,10);save();draw()}

function reports(){
 const E=[["Team Summary","sum"],["Training Progress","trn"],["Student Performance","stu"],["Match History","mat"],["Issues","iss"]];
 return`<h1>Reports & CSV Export</h1><div class=card><div class=top><label>From <input type=date id=df></label><label>To <input type=date id=dt></label></div><div class=top>${E.map(e=>`<button class=b onclick="exp('${e[1]}')">⬇ ${e[0]}</button>`).join("")}</div>
 <p style="color:var(--mu)">${U.role=="head"?"Exports all data matching the filters above (branch/category/search).":"Exports your assigned teams only."} Downloads open directly; if your browser blocks it, copy from the preview below.</p><textarea id=pv rows=10 style="width:100%" readonly placeholder="CSV preview appears here"></textarea></div>`}
function build(k,teams,ids){
 const inR=d=>{const a=$("#df")&&$("#df").value,b=$("#dt")&&$("#dt").value;return(!a||d>=a)&&(!b||d<=b)};
 if(k=="sum")return csv([["Team_ID","Team_Name","Branch","Category","Trainer_Name","Student_Count","Sessions_Completed","Training_Progress_Percent","Current_Phase","Robot_1_Status","Robot_2_Status","Matches_Played","Wins","Losses","Draws","Goals_Scored","Goals_Conceded","Open_Issues","Overall_Status"]].concat(teams.map(t=>{const s=st(t.id);return[t.id,t.name,t.branch,t.cat,t.trainer,t.stu.length,done(t),prog(t),(PH.find(p=>done(t)<=p[1])||PH[8])[2],t.r1?"Functional":"Not Functional",t.r2?"Functional":"Not Functional",s.mp,s.w,s.l,s.d,s.gf,s.ga,open_(t),status(t)[0]]})));
 if(k=="trn")return csv([["Team_ID","Team_Name","Session_Number","Training_Phase","Session_Status","Trainer_Remarks"]].concat(teams.flatMap(t=>t.sess.map((v,i)=>[t.id,t.name,i+1,PH.find(p=>i+1>=p[0]&&i+1<=p[1])[2],SN[v],t.notes[i+1]||""]))));
 if(k=="stu")return csv([["Student_ID","Student_Name","Team_ID","Team_Name","Assessment_Date","Session_Number",...SK.map(s=>s.replace(/\W+/g,"_")+"_Score"),"Total_Percent"]].concat(teams.flatMap(t=>t.stu.flatMap(s=>s.as.filter(a=>inR(a.d)).map(a=>[s.id,s.n,t.id,t.name,a.d,a.cp,...a.s.map(v=>v==null?"Not Assessed":v),asPct(a)])))));
 if(k=="mat")return csv([["Match_ID","Match_Date","Match_Type","Team_A_ID","Team_A_Name","Team_B_ID","Team_B_Name","Team_A_Goals","Team_B_Goals","Team_A_Fouls","Team_B_Fouls","Team_A_Penalties","Team_B_Penalties","Winner_Team_ID","Match_Status"]].concat(D.matches.filter(m=>ids.includes(m.a)||ids.includes(m.b)).filter(m=>inR(m.date)).map(m=>[m.id,m.date,m.type,m.a,tm(m.a).name,m.b,tm(m.b).name,m.ga,m.gb,m.fa,m.fb,m.pa,m.pb,m.ga==m.gb?"Draw":m.ga>m.gb?m.a:m.b,m.status])));
 return csv([["Issue_ID","Team_ID","Team_Name","Issue_Category","Issue_Description","Priority","Reported_By","Assigned_To","Resolution_Deadline","Issue_Status","Corrective_Action","Resolved_Date"]].concat(D.issues.filter(i=>ids.includes(i.team)).map(i=>[i.id,i.team,tm(i.team).name,i.cat,i.desc,i.pri,i.by,i.to,i.due,i.st,i.act,i.resolved||""])))}
function dl(name,txt){const e=$("#pv");if(e)e.value=txt;try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));a.download=name;a.click()}catch(x){}toast("CSV ready: "+name)}
function exp(k){const T=filt();dl(({sum:"Team_Summary",trn:"Training_Progress",stu:"Student_Performance",mat:"Match_History",iss:"Issues"})[k]+".csv",build(k,T,T.map(t=>t.id)))}
function exportTeam(id){const t=tm_(id);["sum","trn","stu","mat","iss"].forEach(k=>dl(t.id+"_"+k+".csv",build(k,[t],[id])));toast("Team CSVs exported (5 files)")}

function exec(){
 const all=D.teams,ms=D.matches.filter(m=>m.status=="Completed"),oi=D.issues.filter(i=>i.st!="Resolved"),today=new Date().toISOString().slice(0,10);
 const ready=all.filter(t=>status(t)[0]=="Competition Ready").length,att=all.filter(late);
 const avg=all.length?R(all.reduce((a,t)=>a+prog(t),0)/all.length):0;
 const rows=all.map(t=>({t,...st(t.id)})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
 const br=BR.map(b=>{const x=all.filter(t=>t.branch==b);return x.length?`<tr><td>${b}<td>${x.length}<td>${R(x.reduce((a,t)=>a+prog(t),0)/x.length)}%<td>${x.filter(t=>status(t)[0]=="Competition Ready").length}<td>${x.reduce((a,t)=>a+open_(t),0)}<td>${x.filter(late).length}</tr>`:""}).join("");
 const why=t=>[done(t)>=10&&!(t.r1&&t.r2)?"robots not both functional by Session 10":"",crit(t)?"critical issue open":""].filter(Boolean).join("; ");
 const K=[["Competition-ready",ready+"/"+all.length],["Avg training progress",avg+"%"],["Mock matches played",ms.length],["Open critical issues",oi.filter(i=>i.pri=="Critical").length],["Teams at risk",att.length],["Overdue issues",oi.filter(i=>i.due<today).length]];
 return`<h1>👔 Executive Summary</h1><p style="color:var(--mu)">Read-only view across all branches and teams.</p><div class=grid>${K.map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
 <div class=two><div class=card><h3>Branch scorecard</h3><div class=tw><table><tr><th>Branch<th>Teams<th>Progress<th>Ready<th>Open issues<th>At risk</tr>${br}</table></div></div>
 <div class=card><h3>⚠️ Teams needing attention</h3>${att.map(t=>`<p><b>${t.name}</b> (${t.branch}, ${t.trainer})<br><span style="color:var(--mu)">${why(t)}</span></p>`).join("")||"🎉 All teams on track"}</div>
 <div class=card><h3>🏆 Top 3 teams</h3>${rows.slice(0,3).map((r,i)=>`<p>${["🥇","🥈","🥉"][i]} <b>${r.t.name}</b> – ${r.w}W ${r.d}D ${r.l}L, GD ${r.gd}</p>`).join("")}</div>
 <div class=card><h3>Team Head reviews</h3>${all.filter(t=>t.review).map(t=>`<p><b>${t.name}:</b> ${t.review}</p>`).join("")||"<p style=\"color:var(--mu)\">No reviews recorded yet.</p>"}</div></div>
 <div class=card style="margin-top:12px"><h3>Training progress by team</h3>${bars(all.map(t=>[t.name,prog(t)]))}</div>`}
